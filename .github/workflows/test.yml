# The test suite on the oldest and newest supported Python, and on macOS once (no /proc there: the sweep reads start
# times from `ps`). Standard library only: nothing to install.
# By hand only (Actions tab, or `gh workflow run test.yml`): hosted minutes are limited, and a push or pull_request
# trigger ran it twice per autopilot ticket. Every merge is already gated by the local check, tools/check_pythons.sh,
# which runs every supported Python installed on the machine. On 3.12 and newer it ends with the 30 slowest tests,
# to show where a slow runner spends its time.
name: tests

on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python3 -m unittest discover -s tests -q $(python3 -c 'import sys; print("--durations 30" * (sys.version_info >= (3, 12)))')
