# The test suite on every supported Python, and on macOS once (no /proc there: the sweep reads start times from `ps`).
# Standard library only: nothing to install.
# Runs on main and on pull requests, not on every branch push: the autopilot pushes its ticket branches often.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python3 -m unittest discover -s tests -q
