# windvane settings for this project. Every key is optional.
name = ""                 # state dir, phone question ids, tmux session
prefix = "T"              # ticket ids: T-001, T-002a
remote = "origin"
main = "main"
forge = "github"          # github: PRs through gh; git: the driver merges and pushes to main itself
check = ""                # the project's CI command, run by `windvane check` (e.g. "npm test", "pytest -q")
setup = ""                # run once in each fresh autopilot worktree (e.g. "npm ci")
isolate = true            # work in the autopilot's own worktrees; false: in this checkout (for huge builds)
goal = ""                 # what `windvane plan` and `run --replan` aim at when given no goal
author = ""               # "Name <email>" for the driver's own commits (merges, plans); default: git's
heavy_check = false       # the check is machine-heavy (an engine, a render): run it under `windvane heavy`

[models]                  # model and effort per role
worker = "opus"
worker_effort = "high"
reviewer = "opus"
reviewer_effort = "high"
critic = "opus"
critic_effort = "high"
planner = "opus"
planner_effort = "high"
preflight = "sonnet"       # reads the next tickets for questions at the start of a run
preflight_effort = "medium"
fix = "opus"               # makes a red or conflicting desk PR merge
fix_effort = "high"

[critic]
enabled = true
pass = 8                  # this or more goes on
floor = 4                 # under this, rethink rather than patch
revisions = 3

[autopilot]
parallel = "auto"         # tickets at a time (a number caps it): those whose Touches don't overlap, while
                          # the usage window has room; each slot gets its own worktrees
max_parallel = 4          # the most slots "auto" opens
cap = 75                  # % of the 5-hour window: pause at it until the window resets
week_cap = 95             # % of the weekly limit: stop
ticket_hours = 3          # one worker run at most
min_slot = 30             # no new ticket with fewer minutes left before the deadline
answer_wait = 10          # minutes a phone question waits before the run builds its recommendation
review_rounds = 3         # reviews asking for changes before a ticket is set aside
partials = 3              # runs in a row that run out of time before a ticket is set aside
subagents = false         # let worker runs spawn subagents (costly; one fresh session per ticket is the design)
inline_diff_lines = 1200  # the reviewer gets diffs up to this size in its prompt
desk_label = "windvane merge"  # forge github: your open PRs with this label are checked and merged between
                          # tickets ("" turns it off)
desk_fixes = 2            # fix sessions per red or conflicting desk PR before it is left for you

# A session of your own between tickets, every few merges, on current main (none by default). It writes tickets
# under .windvane/tickets/ and lines in QUEUE.md, which land on main; anything else it changes is discarded.
# [[periodic]]
# name = "playtest"
# every = 6                 # merged tickets between runs; unset: runs only as another entry's `then`
# minutes = 90              # its time limit; skipped when the deadline is nearer
# setup = "tools/build.sh"  # run first; failing skips this round
# setup_minutes = 60        # a setup still running then is stopped and the round skipped
# prompt = "tools/autopilot/PLAYTEST.md"   # your rules for the session, in your repo
# then = "triage"           # another [[periodic]] run right after, given this one's output (a `then` entry also
                          # gets the critic's unused "Beyond this ticket" notes and the queue, as `windvane plan`)
# land = "near"             # where its new tickets go: near (right after the ticket in progress), next (top of the
                          # queue), end, hold (parked for you), ask (a phone question; no answer: hold). A `then`
                          # entry without its own `land` takes this one's.
